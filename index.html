<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ef6ea2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LUMI" />
  <title>LUMI</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/images/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/icon-180.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 80 80" aria-hidden="true">
          <g fill="currentColor">
            <rect x="5" y="5" width="8" height="8" rx="2"/><rect x="17" y="5" width="8" height="8" rx="2"/><rect x="29" y="5" width="8" height="8" rx="2"/><rect x="41" y="5" width="8" height="8" rx="2"/><rect x="53" y="5" width="8" height="8" rx="2"/><rect x="65" y="5" width="8" height="8" rx="2"/>
            <rect x="5" y="17" width="8" height="8" rx="2"/><rect x="29" y="17" width="8" height="8" rx="2"/><rect x="65" y="17" width="8" height="8" rx="2"/>
            <rect x="5" y="29" width="8" height="8" rx="2"/><rect x="29" y="29" width="8" height="8" rx="2"/><rect x="53" y="29" width="8" height="8" rx="2"/><rect x="65" y="29" width="8" height="8" rx="2"/>
            <rect x="5" y="41" width="8" height="8" rx="2"/><rect x="29" y="41" width="8" height="8" rx="2"/><rect x="41" y="41" width="8" height="8" rx="2"/><rect x="65" y="41" width="8" height="8" rx="2"/>
            <rect x="5" y="53" width="8" height="8" rx="2"/><rect x="17" y="53" width="8" height="8" rx="2"/><rect x="29" y="53" width="8" height="8" rx="2"/><rect x="53" y="53" width="8" height="8" rx="2"/><rect x="65" y="53" width="8" height="8" rx="2"/>
            <rect x="5" y="65" width="8" height="8" rx="2"/><rect x="17" y="65" width="8" height="8" rx="2"/><rect x="29" y="65" width="8" height="8" rx="2"/><rect x="41" y="65" width="8" height="8" rx="2"/><rect x="53" y="65" width="8" height="8" rx="2"/><rect x="65" y="65" width="8" height="8" rx="2"/>
          </g>
        </svg>
        <h1 class="title">LUMI</h1>
      </div>
      <div class="hero-left">
        <button id="connectionMenuBtn" class="header-btn connection-indicator" title="Bağlan" aria-label="Bağlan">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionLabel" class="connection-label">Bağlan</span>
          <span class="sr-only">Bağlantı Butonu</span>
        </button>
      </div>
    </section>

    <nav class="tabs" aria-label="Sekmeler">
      <button class="tab-btn active" data-tab="draw">
        <i class="bi bi-brush-fill" aria-hidden="true"></i>
        <span>Çizim</span>
      </button>
      <button class="tab-btn" data-tab="text">
        <i class="bi bi-chat-left-text-fill text-tab-icon" aria-hidden="true"></i>
        <span>Yazı</span>
      </button>
      <button class="tab-btn" data-tab="anim">
        <i class="bi bi-film" aria-hidden="true"></i>
        <span>Animasyon</span>
      </button>
      <button class="tab-btn" data-tab="device">
        <svg viewBox="0 0 80 80" aria-hidden="true"><g fill="currentColor"><rect x="5" y="5" width="8" height="8" rx="2"/><rect x="17" y="5" width="8" height="8" rx="2"/><rect x="29" y="5" width="8" height="8" rx="2"/><rect x="41" y="5" width="8" height="8" rx="2"/><rect x="53" y="5" width="8" height="8" rx="2"/><rect x="65" y="5" width="8" height="8" rx="2"/><rect x="5" y="17" width="8" height="8" rx="2"/><rect x="29" y="17" width="8" height="8" rx="2"/><rect x="65" y="17" width="8" height="8" rx="2"/><rect x="5" y="29" width="8" height="8" rx="2"/><rect x="29" y="29" width="8" height="8" rx="2"/><rect x="53" y="29" width="8" height="8" rx="2"/><rect x="65" y="29" width="8" height="8" rx="2"/><rect x="5" y="41" width="8" height="8" rx="2"/><rect x="29" y="41" width="8" height="8" rx="2"/><rect x="41" y="41" width="8" height="8" rx="2"/><rect x="65" y="41" width="8" height="8" rx="2"/><rect x="5" y="53" width="8" height="8" rx="2"/><rect x="17" y="53" width="8" height="8" rx="2"/><rect x="29" y="53" width="8" height="8" rx="2"/><rect x="53" y="53" width="8" height="8" rx="2"/><rect x="65" y="53" width="8" height="8" rx="2"/><rect x="5" y="65" width="8" height="8" rx="2"/><rect x="17" y="65" width="8" height="8" rx="2"/><rect x="29" y="65" width="8" height="8" rx="2"/><rect x="41" y="65" width="8" height="8" rx="2"/><rect x="53" y="65" width="8" height="8" rx="2"/><rect x="65" y="65" width="8" height="8" rx="2"/></g></svg>
        <span>Cihaz</span>
      </button>
    </nav>

    <div class="panel-wrap">
      <section id="tab-draw" class="panel" data-wide="1">
        <div class="pixel-wrap">
          <div id="pixelGrid" class="pixel-grid"></div>
        </div>
        <div class="quick-grid">
          <button id="clearGridBtn" class="tool-btn">
            <i class="bi bi-trash3-fill" aria-hidden="true"></i>
            <span>Temizle</span>
          </button>
          <button id="invertGridBtn" class="tool-btn">
            <i class="bi bi-circle-half" aria-hidden="true"></i>
            <span>Tersle</span>
          </button>
          <button id="rotateBtn" class="tool-btn">
            <i class="bi bi-arrow-clockwise rotate-icon" aria-hidden="true"></i>
            <span>Döndür</span>
          </button>
          <button id="sendImgBtn" class="tool-btn">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
            <span id="sendImgBtnLabel">Göster</span>
          </button>
        </div>
        <div class="stack" style="margin-top:10px;">
          <div class="field brightness-shell">
            <div class="text-speed-head">
              <label for="brightnessRange">Parlaklık</label>
              <span id="brightnessFloatVal" class="text-speed-val">8</span>
            </div>
            <div class="brightness-row">
              <div class="brightness-slider-wrap">
                <input id="brightnessRange" class="brightness-slider" type="range" min="0" max="15" value="8" />
              </div>
            </div>
          </div>
          <div class="text-card draw-presets-shell">
            <div id="drawPresetInfo" class="small" style="margin-top:8px;">Henüz kayıt yok.</div>
            <div id="drawPresets" class="frames draw-presets"></div>
          </div>
        </div>
      </section>

      <section id="tab-text" class="panel" hidden>
        <div class="text-studio">
          <div class="text-card text-card-message">
            <input
              id="textInput"
              type="text"
              maxlength="120"
              placeholder="Menti girin..."
              aria-label="Mesaj"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            />
          </div>

          <div class="text-card text-preview-shell">
            <div class="text-preview-row">
              <button id="dirLeftBtn" class="chip-toggle text-dir-btn text-dir-side" aria-label="Sola">
                <i class="bi bi-caret-left-fill" aria-hidden="true"></i>
              </button>
              <div id="textPreviewGrid" class="text-preview-grid" aria-label="8x8 yazı önizleme"></div>
              <button id="dirRightBtn" class="chip-toggle text-dir-btn text-dir-side" aria-label="Sağa">
                <i class="bi bi-caret-right-fill" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="text-control-grid">
            <div class="text-card">
              <div class="text-speed-head">
                <label for="textSpeedInput">Geçiş Hızı</label>
                <span id="textSpeedVal" class="text-speed-val">1.8 harf/s</span>
              </div>
              <div class="text-speed-slider-wrap">
                <input
                  id="textSpeedInput"
                  class="brightness-slider text-speed-slider"
                  type="range"
                  min="5"
                  max="600"
                  step="5"
                  value="90"
                />
              </div>
            </div>
            <div class="text-card">
              <div class="text-speed-head">
                <label for="textBrightnessInput">Parlaklık</label>
                <span id="textBrightnessVal" class="text-speed-val">8</span>
              </div>
              <div class="text-speed-slider-wrap">
                <input
                  id="textBrightnessInput"
                  class="brightness-slider text-speed-slider"
                  type="range"
                  min="0"
                  max="15"
                  step="1"
                  value="8"
                />
              </div>
            </div>
          </div>

          <div class="text-send-wrap">
            <button id="txtSendBtn" class="text-send-btn">
              <i class="bi bi-play-fill" aria-hidden="true"></i>
              <span>Mesajı Oynat</span>
            </button>
          </div>
        </div>
      </section>

      <section id="tab-anim" class="panel" hidden>
        <div class="text-card anim-preview-shell" style="margin-top:10px;">
          <div id="animPreviewGrid" class="text-preview-grid" aria-label="8x8 animasyon önizleme"></div>
        </div>

        <div class="text-card anim-presets-shell" style="margin-top:10px;">
          <div id="animPresetInfo" class="small" style="margin-top:8px;">Henüz kayıt yok.</div>
          <div id="animPresets" class="frames draw-presets"></div>
        </div>
      </section>

      <section id="tab-device" class="panel" hidden>
        <div class="device-grid">
          <button id="pingBtn" class="tool-btn">
            <i class="bi bi-broadcast-pin" aria-hidden="true"></i>
            <span>Ping</span>
          </button>
          <button id="statusBtn" class="tool-btn">
            <i class="bi bi-card-text" aria-hidden="true"></i>
            <span>Durum</span>
          </button>
          <button id="helpBtn" class="tool-btn">
            <i class="bi bi-question-circle" aria-hidden="true"></i>
            <span>Yardım</span>
          </button>
          <button id="clearDeviceBtn" class="tool-btn warn">
            <i class="bi bi-trash3-fill" aria-hidden="true"></i>
            <span>Temizle</span>
          </button>
          <button id="stopBtn" class="tool-btn danger">
            <i class="bi bi-stop-fill" aria-hidden="true"></i>
            <span>Durdur</span>
          </button>
          <button id="themeBtn" class="tool-btn">
            <i class="bi bi-palette-fill" aria-hidden="true"></i>
            <span>Tema</span>
          </button>
        </div>
        <div id="themeMeta" class="theme-meta">Tema: Pembe</div>
        <div class="status-grid" id="statusKv" style="margin-top:10px;"></div>
        <div id="log" class="log"></div>
      </section>
    </div>
  </main>

  <button id="animToggleBtn" class="anim-fab" type="button" hidden>
    <i id="animToggleIcon" class="bi bi-play-fill" aria-hidden="true"></i>
    <span id="animToggleLabel">Oynat</span>
  </button>

  <div id="drawPresetModal" class="frame-editor-modal" hidden>
    <div class="frame-editor-card" role="dialog" aria-modal="true" aria-labelledby="drawPresetModalTitle">
      <button id="drawPresetModalCloseBtn" class="modal-close-btn" type="button" aria-label="Kapat">×</button>
      <div class="draw-preset-title-row">
        <h2 id="drawPresetModalTitle" class="frame-editor-title" contenteditable="true" spellcheck="false"></h2>
        <button id="drawPresetRenameBtn" class="frame-edit-btn draw-preset-rename-btn" type="button" aria-label="Adı düzenle" title="Adı düzenle">
          <i class="bi bi-pencil-fill" aria-hidden="true"></i>
        </button>
      </div>
      <div id="drawPresetGrid" class="pixel-grid frame-editor-grid" aria-label="8x8 çizim düzenleyici"></div>
      <div class="quick-grid">
        <button id="drawPresetClearBtn" class="tool-btn" type="button">
          <i class="bi bi-trash3-fill" aria-hidden="true"></i>
          <span>Temizle</span>
        </button>
        <button id="drawPresetInvertBtn" class="tool-btn" type="button">
          <i class="bi bi-circle-half" aria-hidden="true"></i>
          <span>Tersle</span>
        </button>
        <button id="drawPresetRotateBtn" class="tool-btn" type="button">
          <i class="bi bi-arrow-clockwise rotate-icon" aria-hidden="true"></i>
          <span>Döndür</span>
        </button>
      </div>
      <div class="frame-editor-actions draw-preset-editor-actions">
        <button id="drawPresetModalDeleteBtn" class="tool-btn warn" type="button">
          <i class="bi bi-trash3-fill" aria-hidden="true"></i>
          <span>Sil</span>
        </button>
        <button id="drawPresetModalSaveBtn" class="tool-btn primary" type="button">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span>Kaydet</span>
        </button>
      </div>
    </div>
  </div>

  <div id="animPresetModal" class="frame-editor-modal" hidden>
    <div class="frame-editor-card" role="dialog" aria-modal="true" aria-labelledby="animPresetModalTitle">
      <button id="animPresetModalCloseBtn" class="modal-close-btn" type="button" aria-label="Kapat">×</button>
      <div class="draw-preset-title-row">
        <h2 id="animPresetModalTitle" class="frame-editor-title" contenteditable="true" spellcheck="false"></h2>
        <button id="animPresetRenameBtn" class="frame-edit-btn draw-preset-rename-btn" type="button" aria-label="Adı düzenle" title="Adı düzenle">
          <i class="bi bi-pencil-fill" aria-hidden="true"></i>
        </button>
      </div>
      <div class="text-card anim-preview-shell" style="margin-top:6px;">
        <div id="animPresetModalPreviewGrid" class="text-preview-grid" aria-label="Animasyon düzenleme önizleme"></div>
      </div>
      <div id="frameInfo" class="small" style="margin-top:10px;">0 kare</div>
      <div id="frames" class="frames"></div>
      <div class="frame-editor-actions draw-preset-editor-actions">
        <button id="animPresetModalDeleteBtn" class="tool-btn warn" type="button">
          <i class="bi bi-trash3-fill" aria-hidden="true"></i>
          <span>Sil</span>
        </button>
        <button id="animPresetModalSaveBtn" class="tool-btn primary" type="button">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span>Kaydet</span>
        </button>
      </div>
    </div>
  </div>

  <div id="createAnimModal" class="frame-editor-modal" hidden>
    <div class="frame-editor-card" role="dialog" aria-modal="true" aria-labelledby="createAnimTitle">
      <h2 id="createAnimTitle" class="frame-editor-title">Yeni Animasyon</h2>
      <div class="stack">
        <div class="field">
          <input
            id="createAnimNameInput"
            type="text"
            maxlength="40"
            placeholder="Animasyon adı"
            aria-label="Animasyon adı"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
          <div id="createAnimNameError" class="small" style="margin-top:6px;color:var(--danger-text);"></div>
        </div>
      </div>
      <div class="frame-editor-actions">
        <button id="createAnimCancelBtn" class="secondary" type="button">İptal</button>
        <button id="createAnimCreateBtn" class="tool-btn primary" type="button">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span>Oluştur</span>
        </button>
      </div>
    </div>
  </div>

  <div id="addFrameModal" class="frame-editor-modal" hidden>
    <div class="frame-editor-card" role="dialog" aria-modal="true" aria-labelledby="addFrameTitle">
      <h2 id="addFrameTitle" class="frame-editor-title">Yeni Kare Ekle</h2>
      <div id="addFrameGrid" class="pixel-grid frame-editor-grid" aria-label="8x8 kare editörü"></div>
      <div class="quick-grid">
        <button id="addFrameClearBtn" class="tool-btn" type="button">
          <i class="bi bi-trash3-fill" aria-hidden="true"></i>
          <span>Temizle</span>
        </button>
        <button id="addFrameInvertBtn" class="tool-btn" type="button">
          <i class="bi bi-circle-half" aria-hidden="true"></i>
          <span>Tersle</span>
        </button>
        <button id="addFrameRotateBtn" class="tool-btn" type="button">
          <i class="bi bi-arrow-clockwise rotate-icon" aria-hidden="true"></i>
          <span>Döndür</span>
        </button>
      </div>
      <div class="stack">
        <div class="field brightness-shell">
          <div class="text-speed-head">
            <label for="addFrameDurationInput">Süre</label>
            <span id="addFrameDurationVal" class="text-speed-val">150 ms</span>
          </div>
          <div class="text-speed-slider-wrap">
            <input
              id="addFrameDurationInput"
              class="brightness-slider"
              type="range"
              min="40"
              max="1200"
              step="10"
              value="150"
            />
          </div>
        </div>
        <div class="field brightness-shell">
          <div class="text-speed-head">
            <label for="addFrameBrightnessInput">Parlaklık</label>
            <span id="addFrameBrightnessVal" class="text-speed-val">8</span>
          </div>
          <div class="text-speed-slider-wrap">
            <input
              id="addFrameBrightnessInput"
              class="brightness-slider"
              type="range"
              min="0"
              max="15"
              step="1"
              value="8"
            />
          </div>
        </div>
      </div>
      <div class="frame-editor-actions">
        <button id="addFrameCancelBtn" class="secondary" type="button">İptal</button>
        <button id="addFrameDeleteBtn" class="tool-btn warn" type="button" hidden>
          <i class="bi bi-trash3-fill" aria-hidden="true"></i>
          <span>Kareyi Sil</span>
        </button>
        <button id="addFrameSaveBtn" class="tool-btn primary" type="button">
          <i class="bi bi-check-lg" aria-hidden="true"></i>
          <span>Kareyi Ekle</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/matrix_8_ble_web_app.main.js"></script>
</body>
</html>
